# Tool configuration only — dependencies live in requirements.txt.
# Run tests/lint from the backend/ directory: python -m pytest, python -m ruff check.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: Depends() in parameter defaults is intended.
extend-immutable-calls = ["fastapi.Depends"]
