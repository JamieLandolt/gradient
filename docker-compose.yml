# One-command local demo: `docker compose up`.
# Runs the API + the built frontend against the hosted Supabase project.
# Backend reads backend/.env; the frontend's VITE_* vars are baked at build time
# (they are public — never put the service-role key here).
#
# NOTE: written to standard patterns but not verified in this dev environment
# (no Docker daemon). Verify on a machine with Docker before relying on it.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:4173"
    depends_on:
      - backend
    restart: unless-stopped
