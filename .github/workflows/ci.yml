name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check app tests
      - name: Test with coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Security audit
        run: pip-audit
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test with coverage
        run: npx vitest run --coverage
      - name: Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
